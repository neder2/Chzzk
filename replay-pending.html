<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시보기 찾는 중</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: Canvas;
            color: CanvasText;
        }

        main {
            max-width: 28rem;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <h1>다시보기를 찾는 중입니다</h1>
        <p>시청 기록에 저장된 방송 정보로 다시보기 번호를 조회하고 있습니다.</p>
        <p>다시보기를 찾으면 이 탭에서 바로 이동합니다. 잠시 후에도 이동하지 않으면 기록 목록에서 다시 시도해 주세요.</p>
    </main>
</body>
</html>
